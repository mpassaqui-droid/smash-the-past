name: Unity tests

on:
  pull_request:
  push:
    branches:
      - feature/characters

concurrency:
  group: unity-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  editmode:
    name: EditMode tests
    runs-on: [self-hosted, unity, arm64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run EditMode tests
        id: tests
        shell: bash
        run: >-
          /Applications/Unity/Hub/Editor/6000.0.83f1/Unity.app/Contents/MacOS/Unity
          -batchmode -nographics -quit
          -projectPath SmashThePast
          -runTests -testPlatform EditMode
          -testResults "$GITHUB_WORKSPACE/editmode-results.xml"
          -logFile "$GITHUB_WORKSPACE/editmode.log"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: |
            editmode-results.xml
            editmode.log
